<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Test Agent - Runs</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="page">
    <header>
        <h1>Runs</h1>
        <nav>
            <a href="/specs">Specs</a>
            <a href="/plans">Plans</a>
            <a href="/runs">Runs</a>
            <a href="/workflows">Workflows</a>
            <a href="/settings">Settings</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
        </nav>
    </header>

    <section class="card">
        <h2>Run a Plan</h2>
        <form id="run-form">
            <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center">
                <select id="run-plan-select" required style="padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:0.95rem;background:var(--card-bg);color:var(--text-color);width:100%">
                    <option value="" disabled selected>— select a plan —</option>
                    <option th:each="plan : ${plans}" th:value="${plan.planId}" th:text="${plan.sourceEndpoint} + ' (' + ${plan.planId} + ')'" />
                </select>
                <button type="submit" class="btn-run" style="white-space:nowrap">&#9654; Run Plan</button>
            </div>
        </form>
        <script>
        document.getElementById('run-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const planId = document.getElementById('run-plan-select').value;
            if (!planId) return;
            const btn = e.submitter; btn.disabled = true; btn.textContent = 'Running…';
            fetch('/api/plans/' + planId + '/runs', { method:'POST' })
            .then(r => r.ok ? location.reload() : r.text().then(t => { alert('Error: ' + t); btn.disabled=false; btn.textContent='▶ Run Plan'; }));
        });
        </script>
    </section>

    <section class="card">
        <h2>Run History</h2>
        <div style="overflow-x:auto">
        <table>
            <thead>
                <tr>
                    <th>Run ID</th>
                    <th>Plan ID</th>
                    <th>Total</th>
                    <th>Passed</th>
                    <th>Failed</th>
                    <th>Errors</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="run : ${runs}">
                <td th:text="${run.runId}">run-id</td>
                <td th:text="${run.planId}">plan-id</td>
                <td th:text="${run.summary?.total}">-</td>
                <td><span class="badge badge-ok" th:text="${run.summary?.passed}">-</span></td>
                <td><span class="badge badge-fail" th:text="${run.summary?.failed}">-</span></td>
                <td><span th:text="${run.summary?.errors}">-</span></td>
                <td class="actions">
                    <a th:href="'/runs/' + ${run.runId}" class="btn-view">Details</a>
                    <form th:action="'/ui/runs/' + ${run.runId} + '/report'" method="post" style="display:contents">
                        <button type="submit" class="btn-action">Build Report</button>
                    </form>
                    <a th:href="'/api/runs/' + ${run.runId} + '/report.html'" class="btn-view" target="_blank">View</a>
                    <a th:href="'/api/runs/' + ${run.runId} + '/report.md'" class="btn-dl" download>⬇ MD</a>                    <form th:action="'/ui/runs/' + ${run.runId} + '/delete'" method="post" style="display:contents"
                          onsubmit="return confirm('Delete this run?')">
                        <button type="submit" class="btn-disable">&#128465; Delete</button>
                    </form>                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </section>
</div>
<script>
const themeToggle = document.getElementById('theme-toggle');
const isDarkMode = localStorage.getItem('dark-mode') === 'true';
if (isDarkMode) { document.body.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const darkMode = document.body.classList.contains('dark-mode');
    localStorage.setItem('dark-mode', darkMode);
    themeToggle.textContent = darkMode ? '☀️' : '🌙';
});
</script>
</body>
</html>
