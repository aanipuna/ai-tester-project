<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Test Agent - Specs</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="page">
    <header>
        <h1>API Test Agent</h1>
        <nav>
            <a href="/specs">Specs</a>
            <a href="/plans">Plans</a>
            <a href="/runs">Runs</a>
            <a href="/workflows">Workflows</a>
            <a href="/settings">Settings</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
        </nav>
    </header>

    <section class="card">
        <h2>Upload API Spec</h2>
        <form id="upload-form">
            <label>Source Type
                <select id="sourceType" name="sourceType">
                    <option value="openapi">OpenAPI / Swagger</option>
                    <option value="postman">Postman Collection</option>
                </select>
            </label>
            <label>Spec File
                <input type="file" id="specFile" name="file" required accept=".json,.yaml,.yml" />
            </label>
            <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
                <button type="submit" id="upload-btn" class="btn-action">&#8593; Upload &amp; Ingest</button>
                <span id="upload-msg"></span>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Known Specs</h2>
        <div style="overflow-x:auto">
        <table>
            <thead><tr><th>Spec ID</th><th>Name</th><th>Source</th><th>Imported</th><th>Actions</th></tr></thead>
            <tbody id="spec-tbody">
            <tr th:each="spec : ${specs}">
                <td th:text="${spec.specId}">spec-id</td>
                <td th:text="${spec.name}">name</td>
                <td th:text="${spec.sourceType}">source</td>
                <td th:text="${spec.importedAt}">-</td>
                <td>
                    <div class="actions">
                    <button class="btn-run" th:data-specid="${spec.specId}" onclick="generateAll(this, this.dataset.specid)">&#9889; Generate Plans</button>
                    <form th:action="'/ui/specs/' + ${spec.specId} + '/delete'" method="post" style="display:contents"
                          onsubmit="return confirm('Delete this spec?')">
                        <button type="submit" class="btn-disable">&#128465; Delete</button>
                    </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </section>

<script>
document.getElementById('upload-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('upload-btn');
    const msg = document.getElementById('upload-msg');
    const file = document.getElementById('specFile').files[0];
    if (!file) return;

    btn.disabled = true;
    btn.textContent = 'Uploading…';
    msg.textContent = '';
    msg.className = '';

    const fd = new FormData();
    fd.append('sourceType', document.getElementById('sourceType').value);
    fd.append('file', file);

    fetch('/api/specs', { method: 'POST', body: fd })
        .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
        .then(spec => {
            msg.textContent = '✓ Ingested: ' + spec.name + ' (' + spec.specId + ')';
            msg.className = 'msg-ok';
            document.getElementById('upload-form').reset();
            refreshTable();
        })
        .catch(err => {
            msg.textContent = '✗ ' + (err || 'Upload failed');
            msg.className = 'msg-err';
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = '↑ Upload & Ingest';
        });
});

function refreshTable() {
    fetch('/api/specs')
        .then(r => r.json())
        .then(specs => {
            const tbody = document.getElementById('spec-tbody');
            tbody.innerHTML = specs.map(s => `
                <tr>
                    <td>${s.specId}</td>
                    <td>${s.name || '-'}</td>
                    <td>${s.sourceType || '-'}</td>
                    <td>${s.importedAt ? new Date(s.importedAt).toLocaleString() : '-'}</td>
                    <td><div class="actions">
                        <button class="btn-run" onclick="generateAll(this, '${s.specId}')">&#9889; Generate Plans</button>
                        <form action="/ui/specs/${s.specId}/delete" method="post" style="display:contents" onsubmit="return confirm('Delete this spec?')">
                            <button type="submit" class="btn-disable">&#128465; Delete</button>
                        </form>
                    </div></td>
                </tr>`).join('');
        });
}

function generateAll(btn, specId) {
    if (!confirm('Generate test plans for all endpoints in this spec?')) return;

    let controller = new AbortController();
    let startTime = Date.now();

    let cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-disable';
    cancelBtn.style.cssText = 'font-size:12px;padding:4px 10px;white-space:nowrap';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => controller.abort();
    btn.insertAdjacentElement('afterend', cancelBtn);

    btn.disabled = true;
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    let timer = setInterval(() => {
        let s = Math.round((Date.now() - startTime) / 1000);
        btn.textContent = '\u23f3 Generating\u2026 ' + s + 's';
    }, 1000);
    btn.textContent = '\u23f3 Generating\u2026';

    fetch('/api/plans/generate-all', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ specId: specId }), signal: controller.signal
    })
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(data => {
        clearInterval(timer);
        cancelBtn.remove();
        let s = Math.round((Date.now() - startTime) / 1000);
        btn.textContent = '\u2713 ' + data.generated + ' plans (' + s + 's)';
        btn.style.background = 'var(--success)';
        btn.style.color = '#fff';
        btn.disabled = false;
        setTimeout(() => location.reload(), 2000);
    })
    .catch(err => {
        clearInterval(timer);
        cancelBtn.remove();
        btn.disabled = false;
        btn.style.background = '';
        btn.style.color = '';
        btn.textContent = '\u26a1 Generate Plans';
        if (err.name !== 'AbortError') alert('Error: ' + (err || 'Failed'));
    });
}
</script>
<script>
const themeToggle = document.getElementById('theme-toggle');
const isDarkMode = localStorage.getItem('dark-mode') === 'true';
if (isDarkMode) { document.body.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const darkMode = document.body.classList.contains('dark-mode');
    localStorage.setItem('dark-mode', darkMode);
    themeToggle.textContent = darkMode ? '☀️' : '🌙';
});
</script>
</div>
</body>
</html>
