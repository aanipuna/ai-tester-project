<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${isNew} ? 'New Workflow' : 'Edit Workflow'">Workflow Editor</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
        .field-group { margin-bottom:14px; }
        .field-label { font-size:13px; font-weight:600; margin-bottom:4px; display:block; color:var(--text-color); }
        .wf-input { width:100%; padding:8px 12px; border:1px solid #d1d5db; border-radius:6px; font-size:0.9rem; background:var(--card-bg); color:var(--text-color); box-sizing:border-box; }
        body.dark-mode .wf-input { background:rgba(30,41,59,0.8); border-color:#334155; }
        .wf-input:focus { outline:none; border-color:var(--primary); }
        .step-box { background:rgba(255,255,255,0.55); border:1px solid var(--card-border); border-radius:10px; padding:14px; margin-bottom:12px; }
        body.dark-mode .step-box { background:rgba(30,41,59,0.55); border-color:rgba(51,65,85,0.5); }
        .step-box h4 { margin:0 0 12px 0; font-size:14px; color:var(--text-color); }
        .rule-editor { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
        .section-label { font-size:11px; font-weight:700; color:var(--neutral-500); text-transform:uppercase; letter-spacing:0.5px; margin:10px 0 4px; }
        select.wf-input { cursor:pointer; }
        .msg-ok { color:#16a34a; font-weight:600; }
        .msg-err { color:#dc2626; font-weight:600; }
    </style>
</head>
<body>
<div class="page">
    <header>
        <h1 th:text="${isNew} ? 'New Workflow' : 'Edit Workflow'">Workflow Editor</h1>
        <nav>
            <a href="/specs">Specs</a>
            <a href="/plans">Plans</a>
            <a href="/runs">Runs</a>
            <a href="/workflows">Workflows</a>
            <a href="/settings">Settings</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
        </nav>
    </header>

    <section class="card">
        <div class="field-group">
            <label class="field-label">Workflow Name *</label>
            <input id="wf-name" class="wf-input" placeholder="e.g. OTP Auth Flow" th:value="${workflow?.name ?: ''}" />
        </div>
        <div class="field-group">
            <label class="field-label">Description</label>
            <input id="wf-desc" class="wf-input" placeholder="Optional description" th:value="${workflow?.description ?: ''}" />
        </div>
        <div class="field-group">
            <label class="field-label">Base URL</label>
            <input id="wf-baseurl" class="wf-input" placeholder="https://stg.example.com" th:value="${workflow?.baseUrl ?: ''}" />
        </div>

        <!-- Workflow variables (populated by JS from EXISTING_VARS) -->
        <div class="section-label">Workflow Variables</div>
        <div id="wf-vars-list"></div>
        <button type="button" class="btn-action" style="font-size:13px;margin-top:4px" onclick="addVar()">&#43; Add Variable</button>
    </section>

    <!-- Steps -->
    <section class="card">
        <h2>Steps</h2>
        <div id="steps-container"></div>
        <button type="button" class="btn-action" onclick="addStep()">&#43; Add Step</button>
    </section>

    <div style="display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <button type="button" class="btn-run" onclick="saveWorkflow()">&#10003; Save Workflow</button>
        <a href="/workflows" class="btn-disable" style="text-decoration:none">Cancel</a>
        <span id="save-msg"></span>
    </div>
</div>

<script th:inline="javascript">
// Data only — no functions here to avoid Thymeleaf HTML parsing issues with template literals
const WORKFLOW_ID = /*[[${workflow?.workflowId}]]*/ null;
const EXISTING_STEPS = /*[[${workflow?.steps}]]*/ [];
const EXISTING_VARS = /*[[${workflow?.variables}]]*/ {};
</script>
<script>
// All editor functions in a plain script block (no th:inline) to avoid Thymeleaf parsing issues
const HTTP_METHODS = ['GET','POST','PUT','PATCH','DELETE'];
const EXTRACTION_SOURCES = ['BODY','HEADER','STATUS'];
const INJECTION_TARGETS = ['HEADER','BODY_FIELD','QUERY_PARAM','PATH'];
const CONDITION_SOURCES = ['STATUS','BODY','HEADER'];
const CONDITION_OPS = ['EQ','NE','CONTAINS','EXISTS','EMPTY','LT_STATUS'];

let stepCount = 0;

function makeSel(opts, selected, cls) {
    const s = document.createElement('select');
    s.className = 'wf-input ' + (cls || '');
    s.style.cssText = 'width:auto;flex:0 0 auto';
    opts.forEach(o => {
        const opt = document.createElement('option');
        opt.value = o; opt.textContent = o;
        if (o === selected) opt.selected = true;
        s.appendChild(opt);
    });
    return s;
}
function makeInput(cls, placeholder, value, style) {
    const i = document.createElement('input');
    i.className = 'wf-input ' + (cls || '');
    i.placeholder = placeholder || '';
    i.value = value || '';
    if (style) i.style.cssText = style;
    return i;
}
function makeTd(el) { const d = document.createElement('div'); if (el) d.appendChild(el); return d; }
function makeBtn(text, cls, onClick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = cls || 'btn-disable';
    b.textContent = text; b.style.cssText = 'padding:3px 8px;font-size:12px';
    b.onclick = onClick; return b;
}
function makeSpan(text, style) {
    const s = document.createElement('span');
    s.textContent = text; if (style) s.style.cssText = style; return s;
}
function makeLabel(text, style) {
    const l = document.createElement('div');
    l.className = 'section-label'; l.textContent = text;
    if (style) l.style.cssText = style; return l;
}

function addStep(existing) {
    stepCount++;
    const id = existing && existing.stepId ? existing.stepId : ('new-step-' + stepCount);
    const box = document.createElement('div');
    box.className = 'step-box'; box.dataset.stepId = id;

    // Header row
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    const h4 = document.createElement('h4'); h4.textContent = 'Step ' + stepCount; h4.style.margin = '0';
    const btnRow = document.createElement('div'); btnRow.style.cssText = 'display:flex;gap:6px';
    btnRow.appendChild(makeBtn('↑', 'btn-action', () => moveStep(btnRow, -1)));
    btnRow.appendChild(makeBtn('↓', 'btn-action', () => moveStep(btnRow, 1)));
    btnRow.appendChild(makeBtn('✕', 'btn-disable', () => box.remove()));
    hdr.append(h4, btnRow); box.appendChild(hdr);

    // Name + Method row
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';
    const nameDiv = document.createElement('div');
    const nameLabel = document.createElement('span'); nameLabel.className = 'field-label'; nameLabel.textContent = 'Step Name *';
    const nameInput = makeInput('step-name', 'e.g. Login', existing && existing.name ? existing.name : '', '');
    nameDiv.append(nameLabel, nameInput);
    const methodDiv = document.createElement('div');
    const methodLabel = document.createElement('span'); methodLabel.className = 'field-label'; methodLabel.textContent = 'Method';
    const methodSel = makeSel(HTTP_METHODS, existing && existing.method ? existing.method : 'POST', 'step-method');
    methodDiv.append(methodLabel, methodSel);
    grid.append(nameDiv, methodDiv); box.appendChild(grid);

    // Path
    const pathDiv = document.createElement('div'); pathDiv.className = 'field-group';
    const pathLabel = document.createElement('span'); pathLabel.className = 'field-label'; pathLabel.textContent = 'Path (supports {{vars}})';
    const pathInput = makeInput('step-path', '/api/auth/otp/request', existing && existing.path ? existing.path : '', '');
    pathDiv.append(pathLabel, pathInput); box.appendChild(pathDiv);

    // Body
    const bodyDiv = document.createElement('div'); bodyDiv.className = 'field-group';
    const bodyLabel = document.createElement('span'); bodyLabel.className = 'field-label'; bodyLabel.textContent = 'Request Body (JSON, supports {{vars}})';
    const bodyArea = document.createElement('textarea');
    bodyArea.className = 'wf-input step-body'; bodyArea.style.cssText = 'min-height:64px;font-family:monospace;font-size:0.85rem';
    bodyArea.value = (existing && existing.body) ? existing.body : '';
    bodyDiv.append(bodyLabel, bodyArea); box.appendChild(bodyDiv);

    // Extractions
    const exLabel = makeLabel('Extraction Rules');
    const exAddBtn = makeBtn('+ Add', 'btn-action', () => addExtraction(exContainer));
    exAddBtn.style.cssText = 'font-size:11px;padding:2px 7px;margin-left:6px';
    const exRow = document.createElement('div'); exRow.style.cssText = 'display:flex;align-items:center';
    exRow.append(exLabel, exAddBtn); box.appendChild(exRow);
    const exContainer = document.createElement('div'); exContainer.className = 'extractions'; box.appendChild(exContainer);

    // Injections
    const injLabel = makeLabel('Injection Rules');
    const injAddBtn = makeBtn('+ Add', 'btn-action', () => addInjection(injContainer));
    injAddBtn.style.cssText = 'font-size:11px;padding:2px 7px;margin-left:6px';
    const injRow = document.createElement('div'); injRow.style.cssText = 'display:flex;align-items:center';
    injRow.append(injLabel, injAddBtn); box.appendChild(injRow);
    const injContainer = document.createElement('div'); injContainer.className = 'injections'; box.appendChild(injContainer);

    // Conditions
    const condLabel = makeLabel('Conditions');
    const condAddBtn = makeBtn('+ Add', 'btn-action', () => addCondition(condContainer));
    condAddBtn.style.cssText = 'font-size:11px;padding:2px 7px;margin-left:6px';
    const condRow = document.createElement('div'); condRow.style.cssText = 'display:flex;align-items:center';
    condRow.append(condLabel, condAddBtn); box.appendChild(condRow);
    const condContainer = document.createElement('div'); condContainer.className = 'conditions'; box.appendChild(condContainer);

    // Halt checkbox
    const haltRow = document.createElement('div'); haltRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px';
    const haltCb = document.createElement('input'); haltCb.type = 'checkbox'; haltCb.className = 'step-halt';
    haltCb.checked = !!(existing && existing.haltOnConditionFailure);
    haltCb.id = 'halt-' + id;
    const haltLbl = document.createElement('label'); haltLbl.htmlFor = 'halt-' + id;
    haltLbl.textContent = 'Halt workflow if any condition fails';
    haltRow.append(haltCb, haltLbl); box.appendChild(haltRow);

    document.getElementById('steps-container').appendChild(box);

    if (existing && existing.extractions) existing.extractions.forEach(e => addExtraction(exContainer, e));
    if (existing && existing.injections) existing.injections.forEach(i => addInjection(injContainer, i));
    if (existing && existing.conditions) existing.conditions.forEach(c => addCondition(condContainer, c));
    renumberSteps();
}

function addExtraction(container, existing) {
    if (container instanceof Element && !container.classList.contains('extractions'))
        container = container.closest('.step-box').querySelector('.extractions');
    const row = document.createElement('div'); row.className = 'rule-editor extraction-row';
    const varInput = makeInput('ex-var', 'variableName', existing && existing.variableName ? existing.variableName : '', 'width:160px;flex:0 0 auto');
    const srcSel = makeSel(EXTRACTION_SOURCES, existing && existing.source ? existing.source : 'BODY', 'ex-source');
    const locInput = makeInput('ex-locator', '$.data.token or header-name', existing && existing.locator ? existing.locator : '', 'flex:1;min-width:120px');
    const secLabel = document.createElement('label'); secLabel.style.cssText = 'font-size:12px;display:flex;align-items:center;gap:4px';
    const secCb = document.createElement('input'); secCb.type = 'checkbox'; secCb.className = 'ex-secret';
    secCb.checked = !!(existing && existing.secret);
    secLabel.append(secCb, document.createTextNode(' secret'));
    const delBtn = makeBtn('✕', 'btn-disable', () => row.remove()); delBtn.style.cssText = 'padding:3px 8px;font-size:11px';
    row.append(varInput, srcSel, locInput, secLabel, delBtn);
    container.appendChild(row);
}

function addInjection(container, existing) {
    if (container instanceof Element && !container.classList.contains('injections'))
        container = container.closest('.step-box').querySelector('.injections');
    const row = document.createElement('div'); row.className = 'rule-editor injection-row';
    const refInput = makeInput('inj-ref', '{{step1.authToken}}', existing && existing.variableRef ? existing.variableRef : '', 'flex:1;min-width:140px');
    const arrow = makeSpan('→', 'color:var(--neutral-400)');
    const tgtSel = makeSel(INJECTION_TARGETS, existing && existing.target ? existing.target : 'HEADER', 'inj-target');
    const keyInput = makeInput('inj-key', 'Header name or field', existing && existing.targetKey ? existing.targetKey : '', 'width:160px;flex:0 0 auto');
    const delBtn = makeBtn('✕', 'btn-disable', () => row.remove()); delBtn.style.cssText = 'padding:3px 8px;font-size:11px';
    row.append(refInput, arrow, tgtSel, keyInput, delBtn);
    container.appendChild(row);
}

function addCondition(container, existing) {
    if (container instanceof Element && !container.classList.contains('conditions'))
        container = container.closest('.step-box').querySelector('.conditions');
    const row = document.createElement('div'); row.className = 'rule-editor condition-row';
    const ifSpan = makeSpan('IF', 'font-size:12px;color:var(--neutral-400)');
    const stepInput = makeInput('cond-step', 'source step ID', existing && existing.sourceStepId ? existing.sourceStepId : '', 'width:120px;flex:0 0 auto');
    const srcSel = makeSel(CONDITION_SOURCES, existing && existing.source ? existing.source : 'STATUS', 'cond-source');
    const locInput = makeInput('cond-locator', '$.field or header-name', existing && existing.locator ? existing.locator : '', 'flex:1;min-width:100px');
    const opSel = makeSel(CONDITION_OPS, existing && existing.operator ? existing.operator : 'EQ', 'cond-op');
    const expInput = makeInput('cond-expected', '200', existing && existing.expectedValue ? existing.expectedValue : '', 'width:90px;flex:0 0 auto');
    const delBtn = makeBtn('✕', 'btn-disable', () => row.remove()); delBtn.style.cssText = 'padding:3px 8px;font-size:11px';
    row.append(ifSpan, stepInput, srcSel, locInput, opSel, expInput, delBtn);
    container.appendChild(row);
}

function addVar() {
    const row = document.createElement('div'); row.className = 'rule-editor wf-var-row';
    const keyInput = makeInput('var-key', 'variableName', '', 'width:180px;flex:0 0 auto');
    const eq = makeSpan('=', 'color:var(--neutral-400)');
    const valInput = makeInput('var-val', 'value', '', 'flex:1');
    const delBtn = makeBtn('✕', 'btn-disable', () => row.remove()); delBtn.style.cssText = 'padding:4px 8px';
    row.append(keyInput, eq, valInput, delBtn);
    document.getElementById('wf-vars-list').appendChild(row);
}

function moveStep(btnInHeader, dir) {
    const box = btnInHeader.closest('.step-box');
    const container = document.getElementById('steps-container');
    const steps = [...container.children];
    const idx = steps.indexOf(box);
    const target = idx + dir;
    if (target < 0 || target >= steps.length) return;
    if (dir === -1) container.insertBefore(box, steps[target]);
    else container.insertBefore(steps[target], box);
    renumberSteps();
}

function renumberSteps() {
    [...document.querySelectorAll('.step-box h4')].forEach((h, i) => h.textContent = 'Step ' + (i + 1));
}

function collectWorkflow() {
    const vars = {};
    document.querySelectorAll('.wf-var-row').forEach(r => {
        const k = r.querySelector('.var-key').value.trim();
        if (k) vars[k] = r.querySelector('.var-val').value;
    });
    const steps = [...document.querySelectorAll('.step-box')].map(box => ({
        stepId: box.dataset.stepId,
        name: box.querySelector('.step-name').value.trim(),
        method: box.querySelector('.step-method').value,
        path: box.querySelector('.step-path').value.trim(),
        body: box.querySelector('.step-body').value.trim() || null,
        headers: {}, queryParams: {}, timeoutMs: 10000,
        haltOnConditionFailure: box.querySelector('.step-halt').checked,
        extractions: [...box.querySelectorAll('.extraction-row')].map(r => ({
            variableName: r.querySelector('.ex-var').value.trim(),
            source: r.querySelector('.ex-source').value,
            locator: r.querySelector('.ex-locator').value.trim() || null,
            secret: r.querySelector('.ex-secret').checked
        })).filter(e => e.variableName),
        injections: [...box.querySelectorAll('.injection-row')].map(r => ({
            variableRef: r.querySelector('.inj-ref').value.trim(),
            target: r.querySelector('.inj-target').value,
            targetKey: r.querySelector('.inj-key').value.trim()
        })).filter(i => i.variableRef && i.targetKey),
        conditions: [...box.querySelectorAll('.condition-row')].map(r => ({
            sourceStepId: r.querySelector('.cond-step').value.trim(),
            source: r.querySelector('.cond-source').value,
            locator: r.querySelector('.cond-locator').value.trim() || null,
            operator: r.querySelector('.cond-op').value,
            expectedValue: r.querySelector('.cond-expected').value.trim() || null
        })).filter(c => c.sourceStepId)
    }));
    return { name: document.getElementById('wf-name').value.trim(), description: document.getElementById('wf-desc').value.trim() || null, baseUrl: document.getElementById('wf-baseurl').value.trim() || null, variables: vars, steps };
}

function saveWorkflow() {
    const payload = collectWorkflow();
    if (!payload.name) { alert('Workflow name is required'); return; }
    if (!payload.steps.length) { alert('Add at least one step'); return; }
    const msg = document.getElementById('save-msg');
    const url = WORKFLOW_ID ? '/api/workflows/' + WORKFLOW_ID : '/api/workflows';
    const method = WORKFLOW_ID ? 'PUT' : 'POST';
    fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
        .then(wf => { msg.textContent = 'Saved!'; msg.className = 'msg-ok'; setTimeout(() => location.href = '/workflows/' + wf.workflowId, 800); })
        .catch(err => { msg.textContent = 'Error: ' + (err || 'Save failed'); msg.className = 'msg-err'; });
}

// Init after DOM ready
document.addEventListener('DOMContentLoaded', function() {
    if (EXISTING_VARS && typeof EXISTING_VARS === 'object') {
        Object.entries(EXISTING_VARS).forEach(([k, v]) => {
            const row = document.createElement('div'); row.className = 'rule-editor wf-var-row';
            const ki = makeInput('var-key','variableName', k, 'width:180px;flex:0 0 auto');
            const eq = makeSpan('=','color:var(--neutral-400)');
            const vi = makeInput('var-val','value', v||'', 'flex:1');
            const db = makeBtn('✕','btn-disable', () => row.remove()); db.style.cssText = 'padding:4px 8px';
            row.append(ki, eq, vi, db);
            document.getElementById('wf-vars-list').appendChild(row);
        });
    }
    if (EXISTING_STEPS && EXISTING_STEPS.length) EXISTING_STEPS.forEach(s => addStep(s));
    else addStep();
});
</script>
<script>
const themeToggle = document.getElementById('theme-toggle');
const isDarkMode = localStorage.getItem('dark-mode') === 'true';
if (isDarkMode) { document.body.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const darkMode = document.body.classList.contains('dark-mode');
    localStorage.setItem('dark-mode', darkMode);
    themeToggle.textContent = darkMode ? '☀️' : '🌙';
});
</script>
</body>
</html>
