<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Test Agent - Plans</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="page">
    <header>
        <h1>Plans</h1>
        <nav>
            <a href="/specs">Specs</a>
            <a href="/plans">Plans</a>
            <a href="/runs">Runs</a>
            <a href="/settings">Settings</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
        </nav>
    </header>

    <section class="card">
        <h2>Generate Plans from Spec</h2>
        <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center">
            <select id="gen-spec-select" required style="padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:0.95rem;background:var(--card-bg);color:var(--text-color);width:100%">
                <option value="" disabled selected>— select a spec —</option>
                <option th:each="spec : ${specs}" th:value="${spec.specId}"
                    th:text="${spec.name} + ' — ' + ${spec.endpoints != null ? spec.endpoints.size() : 0} + ' endpoints'" />
            </select>
            <button id="btn-generate-all" class="btn-run" type="button" style="white-space:nowrap">&#9889; Generate All Plans</button>
        </div>
        <div style="margin-top:8px;min-height:20px"><span id="gen-msg" style="font-size:14px"></span></div>
        <script>
        document.getElementById('btn-generate-all').addEventListener('click', function() {
            const specId = document.getElementById('gen-spec-select').value;
            if (!specId) { alert('Please select a spec first.'); return; }
            const btn = this;
            const msg = document.getElementById('gen-msg');

            let controller = new AbortController();
            let startTime = Date.now();

            // Cancel button inline
            let cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn-disable';
            cancelBtn.style.cssText = 'font-size:13px;margin-left:8px';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => controller.abort();
            btn.insertAdjacentElement('afterend', cancelBtn);

            btn.disabled = true;
            btn.textContent = '\u23f3 Generating\u2026';
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Tick elapsed time in the message area
            let timer = setInterval(() => {
                let s = Math.round((Date.now() - startTime) / 1000);
                msg.textContent = '\u23f3 Running\u2026 ' + s + 's elapsed. Large specs take several minutes.';
                msg.style.color = 'var(--neutral-500)';
            }, 1000);

            fetch('/api/plans/generate-all', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ specId: specId }),
                signal: controller.signal
            })
            .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
            .then(data => {
                clearInterval(timer);
                cancelBtn.remove();
                let s = Math.round((Date.now() - startTime) / 1000);
                msg.textContent = '\u2713 Generated ' + data.generated + ' plans in ' + s + 's!';
                msg.style.color = 'var(--success)';
                btn.textContent = '\u2713 Done';
                setTimeout(() => location.reload(), 2000);
            })
            .catch(err => {
                clearInterval(timer);
                cancelBtn.remove();
                btn.disabled = false;
                btn.textContent = '\u26a1 Generate All Plans';
                if (err.name === 'AbortError') {
                    msg.textContent = 'Cancelled.';
                    msg.style.color = 'var(--neutral-500)';
                } else {
                    msg.textContent = '\u2717 ' + (err || 'Failed');
                    msg.style.color = 'var(--danger)';
                }
            });
        });
        </script>
    </section>

    <section class="card">
        <h2>Existing Plans</h2>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px">
            <span style="font-size:13px;color:var(--neutral-500)" th:text="${plans.size()} + ' plan(s)'"></span>
            <button class="btn-disable" onclick="clearAllPlans()" style="font-size:13px">&#128465; Clear All Plans</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px">
        <div th:each="plan : ${plans}"
             class="plan-card"
             th:classappend="${plan.status != 'active'} ? ' plan-card-disabled'">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
                <code style="font-size:11px;color:var(--neutral-500);word-break:break-all" th:text="${plan.planId}">plan-id</code>
                <span class="badge" th:classappend="${plan.status == 'active'} ? 'badge-ok' : 'badge-off'" th:text="${plan.status}">status</span>
            </div>
            <div th:if="${plan.sourceSpecId != null}" style="font-size:11px;color:var(--primary);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" th:text="'Spec: ' + ${plan.sourceSpecId}">spec</div>
            <div style="font-weight:600;font-size:14px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" th:title="${plan.sourceEndpoint}" th:text="${plan.sourceEndpoint}">endpoint</div>
            <div style="font-size:12px;color:var(--neutral-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:12px" th:title="${plan.baseUrl}" th:text="${plan.baseUrl}">url</div>
            <div class="actions">
                <a th:href="'/plans/' + ${plan.planId}" class="btn-view">Details</a>
                <form th:action="'/ui/plans/' + ${plan.planId} + '/run'" method="post" style="display:contents">
                    <button type="submit" class="btn-run">&#9654; Run</button>
                </form>
                <form th:action="'/ui/plans/' + ${plan.planId} + '/delete'" method="post" style="display:contents"
                      onsubmit="return confirm('Delete this plan?')">
                    <button type="submit" class="btn-disable">&#128465;</button>
                </form>
            </div>
        </div>
        </div>
        <div th:if="${plans.empty}" style="text-align:center;padding:40px;color:var(--neutral-400)">
            No plans yet. Generate plans from a spec above.
        </div>
    </section>
</div>
<script>
function clearAllPlans() {
    if (!confirm('Delete ALL plans? This cannot be undone.')) return;
    const btn = event.target;
    btn.disabled = true; btn.textContent = 'Deleting…';
    fetch('/api/plans').then(r => r.json()).then(plans => {
        const ids = plans.map(p => p.planId);
        if (!ids.length) { location.reload(); return; }
        Promise.all(ids.map(id =>
            fetch('/ui/plans/' + id + '/delete', { method: 'POST' })
        )).then(() => location.reload());
    }).catch(() => { btn.disabled = false; btn.textContent = '🗑 Clear All Plans'; });
}
const themeToggle = document.getElementById('theme-toggle');
const isDarkMode = localStorage.getItem('dark-mode') === 'true';
if (isDarkMode) { document.body.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const darkMode = document.body.classList.contains('dark-mode');
    localStorage.setItem('dark-mode', darkMode);
    themeToggle.textContent = darkMode ? '☀️' : '🌙';
});
</script>
</body>
</html>
