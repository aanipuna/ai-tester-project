<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Test Agent - Plans</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="page">
    <header>
        <h1>Plans</h1>
        <nav>
            <a href="/specs">Specs</a>
            <a href="/plans">Plans</a>
            <a href="/runs">Runs</a>
            <a href="/settings">Settings</a>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode">🌙</button>
        </nav>
    </header>

    <section class="card">
        <h2>Generate Plans from Spec</h2>
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
            <label style="flex:1;min-width:200px">Spec
                <select id="gen-spec-select" required>
                    <option value="" disabled selected>— select a spec —</option>
                    <option th:each="spec : ${specs}" th:value="${spec.specId}"
                        th:text="${spec.name} + ' — ' + ${spec.endpoints != null ? spec.endpoints.size() : 0} + ' endpoints'" />
                </select>
            </label>
            <button id="btn-generate-all" class="btn-run" type="button">&#9889; Generate All Plans</button>
            <span id="gen-msg" style="font-size:14px"></span>
        </div>
        <script>
        document.getElementById('btn-generate-all').addEventListener('click', function() {
            const specId = document.getElementById('gen-spec-select').value;
            if (!specId) { alert('Please select a spec first.'); return; }
            const btn = this;
            const msg = document.getElementById('gen-msg');
            btn.disabled = true;
            btn.textContent = '⏳ Generating…';
            msg.textContent = 'This may take a while for large specs…';
            msg.style.color = 'var(--neutral-500)';
            fetch('/api/plans/generate-all', { method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({specId: specId}) })
            .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
            .then(data => {
                msg.textContent = '✓ Generated ' + data.generated + ' plans!';
                msg.style.color = 'var(--success)';
                setTimeout(() => location.reload(), 1500);
            })
            .catch(err => {
                msg.textContent = '✗ ' + (err || 'Failed');
                msg.style.color = 'var(--danger)';
                btn.disabled = false;
                btn.textContent = '⚡ Generate All Plans';
            });
        });
        </script>
    </section>

    <section class="card">
        <h2>Existing Plans</h2>
        <table>
            <thead><tr><th>Plan ID</th><th>Source Endpoint</th><th>Base URL</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="plan : ${plans}">
                <td th:text="${plan.planId}">plan-id</td>
                <td th:text="${plan.sourceEndpoint}">endpoint</td>
                <td th:text="${plan.baseUrl}">url</td>
                <td><span class="badge" th:classappend="${plan.status == 'active'} ? 'badge-ok' : 'badge-off'" th:text="${plan.status}">status</span></td>
                <td class="actions">
                    <a th:href="'/plans/' + ${plan.planId}" class="btn-view">Details</a>
                    <form th:action="'/ui/plans/' + ${plan.planId} + '/run'" method="post" style="display:contents">
                        <button type="submit" class="btn-run">&#9654; Run</button>
                    </form>
                    <form th:action="'/ui/plans/' + ${plan.planId} + '/delete'" method="post" style="display:contents"
                          onsubmit="return confirm('Delete this plan?')">
                        <button type="submit" class="btn-disable">&#128465; Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
<script>
const themeToggle = document.getElementById('theme-toggle');
const isDarkMode = localStorage.getItem('dark-mode') === 'true';
if (isDarkMode) { document.body.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
themeToggle.addEventListener('click', function() {
    document.body.classList.toggle('dark-mode');
    const darkMode = document.body.classList.contains('dark-mode');
    localStorage.setItem('dark-mode', darkMode);
    themeToggle.textContent = darkMode ? '☀️' : '🌙';
});
</script>
</body>
</html>
